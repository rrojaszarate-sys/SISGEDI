# Configuración del proyecto Supabase
# Documentación: https://supabase.com/docs/guides/cli/config

[project]
name = "SISGEDI 2.0"
default_schema = "public"
default_organization = "sisgedi"

[api]
port = 54321
max_rows = 1000
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15
pooler_enabled = true

[studio]
port = 54323
enabled = true

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 1800  # 30 minutos (RF1: Expiración de sesión)
enable_signup = false  # Solo admins pueden crear usuarios
enable_anonymous_sign_ins = false
password_min_length = 8

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[storage]
file_size_limit = 52428800  # 50 MB (RF6: Límite de archivos)

[functions]
port = 54324
enabled = true
